# Jekyll settings for the Arborist Practice Questions site.
# GitHub Pages builds the site from the repository root automatically.

title: Arborist Practice Questions

# This is a project site, so it lives in a sub-folder of your github.io address.
# baseurl must match the repository name exactly (including capitals).
baseurl: "/Arborist-Practice-Questions"

# Your GitHub Pages address, with no trailing slash, e.g. "https://your-username.github.io".
# Used for link previews (LinkedIn, Slack, etc.). Leave empty if unsure.
url: ""

# Optional photo credit shown in the corner of the banner. HTML is allowed, e.g.
# hero_credit: 'Photo: <a href="https://example.com">Name</a>'
hero_credit: ""

# Files Jekyll should not publish
exclude:
  - README.md
