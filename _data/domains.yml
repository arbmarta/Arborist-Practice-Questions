# The five domains, in the order they appear in the menu, home page and About page.
# To add a lesson, list it under its domain with a title, url and one-line description.
# A domain with no lessons shows as "Under construction".

- id: botany
  name: Botany
  core_idea: How trees are built and function
  lessons: []

- id: soils
  name: Soils & Nutrition
  core_idea: The below-ground growing environment
  lessons:
    - title: Soil Analysis
      url: /soil-analysis/
      description: Apply the soil texture triangle and review soil pH.
    - title: Tree Fertilization
      url: /tree-fertilization/
      description: Use the guaranteed analyses from complete fertilizers to calculate application rates.

- id: disorders
  name: Disorders & Disturbances
  core_idea: What damages or impairs trees
  lessons:
    - title: Disorders and Diagnostics
      url: /disorders/
      description: Define important terms, tell signs from symptoms, and order the diagnostic steps.

- id: operations
  name: Arboriculture Operations
  core_idea: Practical management of individual trees
  lessons: []

- id: urban-forestry
  name: Urban Forestry
  core_idea: Management of trees at population and landscape scale
  lessons: []
